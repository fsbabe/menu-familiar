<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E6B57">
<title>Menú Familiar</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: pizarra semanal — una fila por día, columnas Cole · Comida · Merienda · Cena; en móvil, tarjetas apiladas */
:root{
  --bg:#F2F4EF; --surface:#FFFFFF; --surface-2:#E8ECE4; --ink:#1C2620; --muted:#5E6B62; --line:#D3DACF;
  --accent:#1E6B57; --accent-ink:#FFFFFF; --accent-soft:#D7EAE2;
  --p-carne:#B0482F; --p-pblanco:#3C7FA8; --p-pazul:#22446E; --p-huevo:#C9940E; --p-legumbre:#7A5737; --p-ninguna:#8A958C;
  --ok:#2E7D4F; --warn:#B26A00; --bad:#B3261E; --ok-soft:#DCEFE2; --warn-soft:#F8E8CC; --bad-soft:#F6D9D6;
  --f-display:"Young Serif", Georgia, "Times New Roman", serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141A16; --surface:#1C2420; --surface-2:#242E28; --ink:#E6ECE6; --muted:#9AA79E; --line:#34413A;
  --accent:#5BC2A2; --accent-ink:#0E1A15; --accent-soft:#1F3A31;
  --p-carne:#E07A5F; --p-pblanco:#74B3DB; --p-pazul:#8FA9E0; --p-huevo:#E8C04A; --p-legumbre:#C49A6C; --p-ninguna:#8A958C;
  --ok:#6FCF97; --warn:#F2B04C; --bad:#F28B82; --ok-soft:#1E3A2A; --warn-soft:#3D2E14; --bad-soft:#42201D;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141A16; --surface:#1C2420; --surface-2:#242E28; --ink:#E6ECE6; --muted:#9AA79E; --line:#34413A;
  --accent:#5BC2A2; --accent-ink:#0E1A15; --accent-soft:#1F3A31;
  --p-carne:#E07A5F; --p-pblanco:#74B3DB; --p-pazul:#8FA9E0; --p-huevo:#E8C04A; --p-legumbre:#C49A6C; --p-ninguna:#8A958C;
  --ok:#6FCF97; --warn:#F2B04C; --bad:#F28B82; --ok-soft:#1E3A2A; --warn-soft:#3D2E14; --bad-soft:#42201D;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1240px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;justify-content:space-between}
.brand h1{font-size:26px}
.brand .who{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:999px;overflow-x:auto;max-width:100%}
.tabs button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-weight:600;font-size:14px;white-space:nowrap;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.weeknav{display:flex;align-items:center;gap:4px;margin-left:auto}
.weeknav .lbl{font-weight:600;min-width:13.5em;text-align:center;font-size:14px}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:4px 8px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.icon{width:30px;height:30px;justify-content:center;padding:0}

.notice{margin-top:14px;padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.notice.info{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.notice .grow{flex:1;min-width:200px}

/* balance */
.balance{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}
.balance .t{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-right:4px}
.bchip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 8px;font-size:13px}
.bchip b{font-family:var(--f-mono);font-weight:500}
.bchip .st{font-size:11px;padding:1px 7px;border-radius:999px;font-weight:600}
.st.ok{background:var(--ok-soft);color:var(--ok)}.st.warn{background:var(--warn-soft);color:var(--warn)}.st.bad{background:var(--bad-soft);color:var(--bad)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}

/* week grid */
.grid{margin-top:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.ghead,.row{display:grid;grid-template-columns:88px minmax(0,1fr) minmax(0,1.15fr) minmax(0,.8fr) minmax(0,1.25fr);}
.ghead>div{padding:9px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;background:var(--surface-2)}
.row{border-top:1px solid var(--line)}
.row.weekend{background:color-mix(in srgb,var(--surface-2) 45%,var(--surface))}
.cell{padding:12px;min-width:0;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:6px;position:relative}
.cell:first-child{border-left:0}
.day .dn{font-family:var(--f-display);font-size:20px;line-height:1}
.day .dd{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.day .kc{margin-top:auto;font-size:11px;color:var(--muted);line-height:1.5}
.lab{display:none;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.dish{display:flex;gap:7px;align-items:flex-start;font-size:14px}
.dish .dot{margin-top:5px}
.dish a{color:inherit;text-decoration:none;border-bottom:1px dotted color-mix(in srgb,var(--muted) 60%,transparent)}
.dish a:hover{border-bottom-color:var(--accent);color:var(--accent)}
.dish .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;flex:none;width:3.4em;margin-top:2px}
.extra{font-size:13px;color:var(--muted)}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-weight:600;white-space:nowrap}
.row.locked .cell{background:color-mix(in srgb,var(--accent-soft) 35%,transparent)}
.lockbtn{padding:2px 6px;font-size:11px;margin-top:6px;align-self:flex-start;color:var(--muted)}
.lockbtn[aria-pressed="true"]{color:var(--accent)}
.cell.out{background:repeating-linear-gradient(135deg,transparent 0 8px,color-mix(in srgb,var(--line) 45%,transparent) 8px 9px)}
.tag.outtag{background:var(--warn-soft);color:var(--warn)}
.tag.home{background:var(--ok-soft);color:var(--ok)}
.stat-row{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--surface-2);border-radius:10px;padding:10px 14px;min-width:130px}
.stat b{font-family:var(--f-display);font-size:24px;font-weight:400;display:block}
.prop{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.prop .grow{flex:1;min-width:0}
.sub{display:flex;flex-direction:column;gap:4px}
.sub+.sub{border-top:1px dashed var(--line);padding-top:8px;margin-top:2px}
.subhead{display:flex;align-items:center;justify-content:space-between;gap:6px}
.sublab{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.tag.harv{background:var(--accent-soft);color:var(--accent)}
.tag.pin{background:var(--accent-soft);color:var(--accent)}
.checks{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.ck{font-size:11px;padding:1px 7px;border-radius:5px;font-weight:600}
.bal{display:flex;gap:3px;flex-wrap:wrap}
.bp{font-size:10.5px;padding:0 6px;border-radius:4px;font-weight:600;line-height:1.7}
.bp.ok{background:var(--ok-soft);color:var(--ok)}.bp.bad{background:var(--bad-soft);color:var(--bad)}.bp.warn{background:var(--warn-soft);color:var(--warn)}
.ck.info{background:var(--warn-soft);color:var(--warn);font-weight:500}
.ck.ok{background:var(--ok-soft);color:var(--ok)}.ck.bad{background:var(--bad-soft);color:var(--bad)}
.editbtn{position:absolute;top:8px;right:8px;opacity:.0;transition:opacity .15s}
.cell:hover .editbtn,.editbtn:focus-visible{opacity:1}
@media (hover:none){.editbtn{opacity:.8}}
.empty-cell{font-size:13px;color:var(--muted);font-style:italic}

.editor{background:var(--surface-2);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.editor select{width:100%}
.editor .acts{display:flex;gap:6px;flex-wrap:wrap}

select,input[type=text],input[type=number],input[type=date],textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-width:0;max-width:100%}
textarea{width:100%;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
label.f>input,label.f>select,label.f>textarea{font-weight:400;color:var(--ink);font-size:14px}

/* panels */
.panel{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.panel h2{font-size:21px;margin-bottom:4px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:22px}
.sec-h h2{font-size:24px}

/* school editor */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:12px}
.sday{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:8px;min-width:0}
.sday h3{font-size:17px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 9px;font-size:12px;font-weight:600;display:inline-flex;gap:5px;align-items:center;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:currentColor;background:var(--surface-2);color:var(--ink)}
.weeks-list{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

/* recipes */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:12px}
.rcard{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0}
.rcard:hover{border-color:var(--muted)}
.rcard .nm{font-weight:600;font-size:15px}
.rcard .meta{display:flex;gap:4px;flex-wrap:wrap}

/* modal */
.overlay{position:fixed;inset:0;background:rgb(10 16 12 / .45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 12px 24px;overflow-y:auto}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:640px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgb(0 0 0 / .3)}
.modal h2{font-size:23px}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cbx{display:flex;gap:10px;flex-wrap:wrap;font-size:14px}
.cbx label{display:flex;gap:5px;align-items:center}
table.port{width:100%;border-collapse:collapse;font-size:13px}
table.port th,table.port td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.port th:first-child,table.port td:first-child{text-align:left;white-space:normal}
table.port th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.tscroll{overflow-x:auto}

/* shopping */
.shop{columns:2 280px;column-gap:24px;margin-top:10px}
.shop label{display:flex;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);break-inside:avoid;font-size:14px;align-items:baseline}
.shop label .q{margin-left:auto;font-family:var(--f-mono);font-size:13px;color:var(--muted);white-space:nowrap}
.shop input:checked+span{text-decoration:line-through;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.rules{font-size:13px;color:var(--muted);margin-top:12px;line-height:1.6}

@media (max-width:860px){
  .lockbtn{margin-top:0}
  .ghead{display:none}
  .row{grid-template-columns:1fr;border-top:8px solid var(--bg)}
  .grid{background:transparent;border:0}
  .row{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
  .row.weekend{background:var(--surface)}
  .cell{border-left:0;border-top:1px solid var(--line)}
  .cell:first-child{border-top:0;flex-direction:row;align-items:baseline;gap:10px;background:var(--surface-2)}
  .day .kc{margin-top:0;margin-left:auto;text-align:right}
  .lab{display:block}
  .editbtn{opacity:.8}
  .weeknav{margin-left:0;width:100%;justify-content:space-between}
  .weeknav .lbl{min-width:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
.login{max-width:420px;margin:12vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:12px}
.login h1{font-size:28px}
#session{text-transform:none;letter-spacing:0;margin-left:8px}
#session button{font-size:12px;padding:2px 8px}
</style>
</head>
<body>
<div id="login-screen" class="login" hidden>
  <h1>Menú Familiar</h1>
  <p class="muted">Entra con tu email. Te llegará un enlace para acceder; no hace falta contraseña.</p>
  <form id="login-form" style="display:flex;flex-direction:column;gap:10px">
    <label class="f">Email<input type="email" id="login-email" required autocomplete="email"></label>
    <button class="btn primary" type="submit" id="login-btn">Enviarme el enlace</button>
  </form>
  <p class="small" id="login-msg" role="status"></p>
</div>
<div id="app-root" hidden>


<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Menú Familiar</h1>
      <span class="who">2 adultos · niñas de 5, 3 y 1 año <span id="session"></span></span>
    </div>
    <div class="bar">
      <div class="tabs" role="tablist" id="tabs">
        <button role="tab" data-act="tab" data-tab="semana" aria-selected="true">Semana</button>
        <button role="tab" data-act="tab" data-tab="cole" aria-selected="false">Menú del cole</button>
        <button role="tab" data-act="tab" data-tab="recetas" aria-selected="false">Recetas</button>
        <button role="tab" data-act="tab" data-tab="ajustes" aria-selected="false">Ajustes</button>
      </div>
      <div class="weeknav" id="weeknav">
        <button class="btn icon ghost" data-act="wk-prev" aria-label="Semana anterior">‹</button>
        <span class="lbl" id="wklbl">—</span>
        <button class="btn icon ghost" data-act="wk-next" aria-label="Semana siguiente">›</button>
        <button class="btn sm ghost" data-act="wk-today">Hoy</button>
      </div>
    </div>
  </header>
  <main id="main"><p class="muted" style="margin-top:20px">Cargando recetas y menús…</p></main>
</div>
<div id="modal-root"></div>
<div id="toast" class="toast" hidden></div>


</div>

<script src="config.js"></script>
<script src="db.js"></script>
<script>
(() => {
/* ---------- constantes ---------- */
const PROT = {
  carne:{l:"Carne",c:"var(--p-carne)"}, pblanco:{l:"Pescado blanco",c:"var(--p-pblanco)"},
  pazul:{l:"Pescado azul",c:"var(--p-pazul)"}, huevo:{l:"Huevo",c:"var(--p-huevo)"},
  legumbre:{l:"Legumbre",c:"var(--p-legumbre)"}, ninguna:{l:"Sin proteína",c:"var(--p-ninguna)"}
};
const GROUPS = {verdura:"Verdura cocinada",cruda:"Hortaliza cruda",cereal:"Cereal / pasta / arroz",patata:"Patata",legumbre:"Legumbre",lacteo:"Lácteo",fruta:"Fruta"};
const BASES = {cereal:"Cereal / pasta / arroz",patata:"Patata",legumbre:"Legumbre",verdura:"Verdura"};
const COURSES = {primero:"Primero",segundo:"Segundo",completo:"Plato completo",guarnicion:"Guarnición",merienda:"Merienda / snack"};
const MEALS = {comida:"Comida",cena:"Cena",merienda:"Merienda y snack"};
const DOW = ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
const MONTHS = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const DEFAULTS = {
  diners:[
    {id:"h",name:"Hombre",kcal:1800,factor:1},
    {id:"m",name:"Mujer",kcal:1600,factor:0.9},
    {id:"n5",name:"Niña 5 años",kcal:1400,factor:0.6},
    {id:"n3",name:"Niña 3 años",kcal:1250,factor:0.5},
    {id:"n1",name:"Niña 1 año",kcal:900,factor:0.35}
  ],
  adultFormat:"alternar", meriendaFor:"todos", noSchool:"pauta", pizza:"si",
  targets:{carne:[3,4],pescado:[3,4],pazul:[1,2],huevo:[3,4],legumbre:[2,4]},
  breadKcal:100, fruitKcal:80, dairyKcal:70
};
const pcat = p => (p==="pblanco"||p==="pazul") ? "pescado" : p;
const DIN_MAP = {carne:["pescado","huevo"], pescado:["carne","huevo"], huevo:["pescado","carne"]};
const CAT_L = {carne:"carne",pescado:"pescado",huevo:"huevo",legumbre:"legumbre"};

/* ---------- estado ---------- */
const S = {db:null, dbState:"loading", sample:null, sampleImages:false,
  recipes:{}, school:{}, plans:{}, settings:null, pantry:null, knowledge:null, aiProps:null, aiBusy:false, downloads:null, loaded:{recipes:false,school:false,plans:false,settings:false},
  tab:"semana", week:null, weekAuto:true, editing:null, recFilter:{meal:"",course:"",prot:"",q:"",h:false},
  saving:false, importing:false, ticks:{}};

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = parseISO(s); d.setDate(d.getDate()+n); return iso(d); };
const mondayOf = s => { const d = parseISO(s); const k = (d.getDay()+6)%7; d.setDate(d.getDate()-k); return iso(d); };
const fmtShort = s => { const d = parseISO(s); return `${d.getDate()} ${MONTHS[d.getMonth()]}`; };
const weekDates = w => Array.from({length:7},(_,i)=>addDays(w,i));
const settings = () => ({...DEFAULTS, ...(S.settings||{}), targets:{...DEFAULTS.targets, ...((S.settings||{}).targets||{})}, diners:(S.settings&&S.settings.diners)||DEFAULTS.diners});

/* ---------- reglas ---------- */
function realSchoolDay(date){ const w = S.school[mondayOf(date)]; const d = w && w.days && w.days[date]; return d && !d.sinCole ? d : null; }

  const w = S.school[mondayOf(date)]; const d = w && w.days && w.days[date];
  if(d) return d.sinCole ? null : d;
  const wd=(parseISO(date).getDay()+6)%7; if(wd>=5 || settings().noSchool!=="pauta") return null;

/* Pauta del cole: para un día sin menú, proteína, base y postre más habituales ese día de la semana, pesando más las semanas recientes */
function estimateSchool(date){
  const key=date+"|"+Object.values(S.school).map(w=>w.updated||0).join(",");
  S._est=S._est||{}; if(key in S._est) return S._est[key];
  const wd=(parseISO(date).getDay()+6)%7; const tMon=parseISO(mondayOf(date));
  const P={}, B={}, D={}, L={}; let n=0;
  Object.values(S.school).forEach(w=>Object.entries(w.days||{}).forEach(([ds,d])=>{
    if(!d || d.sinCole || d.estimado) return; const dt=parseISO(ds); if((dt.getDay()+6)%7!==wd) return;
    const weeks=Math.abs(Math.round((tMon-parseISO(mondayOf(ds)))/6048e5)); const wt=1/(1+weeks/4); n++;
    const pr=(d.prot||[]); const main=pr.find(x=>x!=="legumbre")||pr[0]; if(main) P[main]=(P[main]||0)+wt;
    if(pr.includes("legumbre")||d.base==="legumbre") L.y=(L.y||0)+wt; else L.n=(L.n||0)+wt;
    if(d.base) B[d.base]=(B[d.base]||0)+wt; D[d.postreTipo||"fruta"]=(D[d.postreTipo||"fruta"]||0)+wt;
  }));
  const top=o=>Object.entries(o).sort((a,b)=>b[1]-a[1])[0];
  let res=null;
  if(n){
    const p=top(P), b=top(B), dd=top(D);
    let base=b?b[0]:"cereal"; const prot=[]; if(p) prot.push(p[0]);
    if((L.y||0)>(L.n||0)){ base="legumbre"; if(!prot.includes("legumbre")) prot.push("legumbre"); }
    if(!prot.length) prot.push("carne");
    res={estimado:true, n, primero:"", segundo:"", guarnicion:"", postre:"", prot, base, postreTipo:dd?dd[0]:"fruta"};
  }
  S._est[key]=res; return res;
}
function lunchProfile(day){
  // day: {date, school, comida:{ids}}
  if(day.school){ const s=day.school; return {prots:(s.prot||[]), base:s.base||"", dessert:s.postreTipo||"fruta", src:"cole"}; }
  const rs=(day.comida&&day.comida.ids||[]).map(R).filter(Boolean);
  const prots=[...new Set(rs.map(r=>r.protein).filter(p=>p&&p!=="ninguna"))];
  const gs=new Set(rs.flatMap(r=>r.groups||[]));
  let base = gs.has("legumbre")?"legumbre": gs.has("cereal")?"cereal": gs.has("patata")?"patata": (gs.has("verdura")||gs.has("cruda"))?"verdura":"";

}
function allowedDinner(prots){
  const cats=[...new Set(prots.map(pcat).filter(c=>DIN_MAP[c]))];
  let a=["carne","pescado","huevo"];
  cats.forEach(c=>{ a=a.filter(x=>DIN_MAP[c].includes(x)); });
  if(!a.length) a=["huevo"];
  return a;
}
function needGroups(base){
  if(["cereal","patata","legumbre"].includes(base)) return {need:["verdura","cruda"], label:"verduras u hortalizas", avoid:["cereal","patata","legumbre"]};
  if(base==="verdura") return {need:["cereal","patata"], label:"cereal o patata", avoid:[]};
  return {need:[],label:"",avoid:[]};
}
function dessertRule(lunchDessert){ return (lunchDessert==="lacteo"||lunchDessert==="ambos") ? ["fruta"] : ["lacteo","fruta"]; }

/* Cena recomendada por el cole: «Base · proteína · postre» → objetivo estructurado */
function parseSug(sug){
  if(!sug) return null; const parts=String(sug).split("·").map(x=>norm(x));
  const b=parts[0]||"", pr=parts[1]||"", ds=parts.slice(2).join(" ");
  const groups=[]; let label="";
  if(/legumbr/.test(b)){ groups.push("legumbre"); label="legumbre"; }
  else if(/verdura/.test(b)){ groups.push("verdura"); label="verdura cocinada"; }
  else if(/hortaliza|crud/.test(b)){ groups.push("cruda"); label="hortaliza cruda"; }
  else { if(/patata/.test(b)) groups.push("patata"); if(/arroz|cereal|quinoa|trigo/.test(b)) groups.push("cereal"); label=String(sug).split("·")[0].trim().toLowerCase(); }
  const prot = /azul/.test(pr)?"pazul" : /blanco/.test(pr)?"pblanco" : /pescado/.test(pr)?"pescado" : /carne/.test(pr)?"carne" : /huevo/.test(pr)?"huevo" : null;
  return {groups, label, prot, lacteo:/yogur|lacteo|leche/.test(ds)};
}
const PROT_TXT = {carne:"carne magra",pblanco:"pescado blanco",pazul:"pescado azul",pescado:"pescado",huevo:"huevo"};
function dinnerTarget(day){
  const lp=lunchProfile(day); const allowed=allowedDinner(lp.prots); const ng=needGroups(lp.base);
  const rule={allowed, prefer:null, ng, desserts:dessertRule(lp.dessert), src:"regla", note:""};
  const rec=day.school && !day.school.estimado ? parseSug(day.school.sug) : null;
  if(!rec || !rec.prot) return rule;
  const rc=pcat(rec.prot);
  if(!allowed.includes(rc)) return {...rule, note:`El cole recomienda ${PROT_TXT[rec.prot]}, pero repite la proteína de la comida: uso ${allowed.join(" o ")}.`};
  return {allowed:[rc], prefer:(rec.prot==="pazul"||rec.prot==="pblanco")?rec.prot:null,
    ng: rec.groups.length ? {need:rec.groups, label:rec.label, avoid:[]} : ng,
    desserts: rec.lacteo?["lacteo","fruta"]:["fruta"], src:"cole", note:""};
}
/* Recetas con proteína a elegir (p. ej. Peli y pizza): la cobertura se guarda en el hueco como «top» */
const slotProts = slot => ((slot&&slot.ids)||[]).map(R).filter(Boolean).map(r=>r.toppings&&slot.top?slot.top:r.protein);
const topName = (r,top) => r&&r.toppings&&r.toppings[top] ? parseIng(r.toppings[top]).n : "";
const dowOf = date => (parseISO(date).getDay()+6)%7;
function topFor(r, tg){
  if(!r||!r.toppings) return [];
  if(tg.ng.need.length && !hasG(r,tg.ng.need)) return [];
  return Object.keys(r.toppings).filter(p=>tg.allowed.includes(pcat(p)) && (!tg.prefer || pcat(tg.prefer)!==pcat(p) || p===tg.prefer));
}
function dinnerChecks(day){
  const lp=lunchProfile(day); const rs=(day.cena&&day.cena.ids||[]).map(R).filter(Boolean);
  if(!rs.length) return [];
  const tg=dinnerTarget(day); const allowed=tg.allowed;
  const dprot=[...new Set(slotProts(day.cena).filter(p=>p&&p!=="ninguna").map(pcat))];
  const animal=dprot.filter(c=>c!=="legumbre");

  const ng=tg.ng; const gs=rs.flatMap(r=>r.groups||[]);

  const c=tg.src==="cole"?" (cole)":"";
  const out=[
    {ok:protOk, t: protOk ? `Proteína ✓${c}` : `Proteína: mejor ${allowed.map(x=>tg.prefer?PROT_TXT[tg.prefer]:x).join(" o ")}`},
    {ok:baseOk, t: baseOk ? `Guarnición ✓${c}` : `Falta ${ng.label}`},
    {ok:dOk, t: dOk ? `Postre ✓` : `Postre: mejor fruta`}

/* ---------- generador ---------- */
function weekCounts(days){
  const c={carne:0,pescado:0,pazul:0,huevo:0,legumbre:0};
  const addOcc = (prots, groups) => {
    const cats=new Set(prots.map(pcat)); if((groups||[]).includes("legumbre")) cats.add("legumbre");
    cats.forEach(k=>{ if(k in c) c[k]++; }); if(prots.includes("pazul")) c.pazul++;
  };
  for(const d of days){
    if(d.school){ const s=d.school; addOcc(s.prot||[], s.base==="legumbre"?["legumbre"]:[]); }
    else if(d.comida){ const rs=d.comida.ids.map(R).filter(Boolean); addOcc(rs.map(r=>r.protein).filter(p=>p!=="ninguna"), rs.flatMap(r=>r.groups||[])); }
    if(d.cena){ const rs=(d.cena.ids||[]).map(R).filter(Boolean); addOcc(slotProts(d.cena).filter(p=>p&&p!=="ninguna"), rs.flatMap(r=>r.groups||[])); }
  }

/* Equilibrio del plato (primero+segundo o plato completo): proteína, verdura, hidratos y grasa saludable */
const FAT_RE=/aceite|aguacate|nuez|nueces|almendr|sesamo|tahini|aceituna|frutos secos|cacahuete/;
function mealBalance(recs){
  recs=recs.filter(Boolean); const gs=new Set(recs.flatMap(r=>r.groups||[]));
  const hcN=recs.filter(r=>hasG(r,["cereal","patata","legumbre"])).length;
  return { prot: recs.some(r=>r.toppings || (r.protein&&r.protein!=="ninguna")),
    veg: gs.has("verdura")||gs.has("cruda"), hc: hcN>0, dupHc: hcN>1 && recs.filter(r=>hasG(r,["cereal","patata"])).length>1,
    fat: recs.some(r=>r.protein==="pazul" || (r.ingredients||[]).some(l=>FAT_RE.test(norm(l)))) };
}
/* En la cena el pan cubre los hidratos si el plato no los lleva (lo recomienda el cole) */
function balScore(recs, meal){ const b=mealBalance(recs); return (b.prot?2:0)+(b.veg?2.5:0)+(meal==="cena"?(b.hc?0.3:0):(b.hc?2:0))+(b.fat?1:0)-(b.dupHc?2:0); }
function pickPair(prims, segs, sp, ss, meal, extra, rng){
  let best=null, bs=-Infinity;
  const P=prims.length?prims:[null], G=segs.length?segs:[null];
  for(const a of P) for(const b of G){ if(!a&&!b) continue;
    const sc=(a?sp(a):0)+(b?ss(b):0)+balScore([a,b],meal)*1.5+(extra?extra(a,b):0)+rng()*1.2;
    if(sc>bs){ bs=sc; best=[a,b]; } }
  return best||[null,null];
}
function pickBest(cands, score, rng){ let best=null, bs=-Infinity; for(const r of cands){ const s=score(r)+rng()*1.2; if(s>bs){bs=s;best=r;} } return best; }

const SLOT_ORDER = {snack:0, comida:1, merienda:2, cena:3};
const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim();
const pairKey = (a,b) => [a,b].sort().join("|");
function ingName(line){ return parseIng(line).n; }
function pantryList(){ return ((S.pantry&&S.pantry.items)||[]).map(norm).filter(Boolean); }
function inPantry(name, pl){ const n=norm(name); return !!n && pl.some(p=>n.includes(p)||p.includes(n)); }
function pantryScore(r, pl){ if(!pl.length) return 0; const ings=(r.ingredients||[]).map(ingName).filter(n=>!/aceite|sal\b|agua|pimienta/i.test(n)); if(!ings.length) return 0; return ings.filter(n=>inPantry(n,pl)).length/ings.length*4; }
function knowledge(excludeWeek){
  const k={freq:{},pair:{},meals:0};
  const add = ids => { if(!ids.length) return; k.meals++; ids.forEach(id=>k.freq[id]=(k.freq[id]||0)+1); for(let i=0;i<ids.length;i++) for(let j=i+1;j<ids.length;j++){ const p=pairKey(ids[i],ids[j]); k.pair[p]=(k.pair[p]||0)+1; } };
  Object.values(S.plans).forEach(p=>{ if(p.weekId===excludeWeek) return; (p.days||[]).forEach(d=>["comida","cena"].forEach(key=>{ const s=d[key]; if(s&&!s.fuera&&s.ids) add(s.ids.filter(R)); })); });
  const imp=S.knowledge||{}; Object.entries(imp.freq||{}).forEach(([id,n])=>k.freq[id]=(k.freq[id]||0)+n); Object.entries(imp.pair||{}).forEach(([p,n])=>k.pair[p]=(k.pair[p]||0)+n); k.meals+=imp.meals||0;
  return k;
}
function lunchVeg(day){
  const v=new Set();
  if(day.school){ const s=day.school; const t=norm((s.primero||"")+" "+(s.guarnicion||""));
    if(s.base==="verdura" || /crema|pure|verdura|menestra|pisto|brocoli|coliflor|judias|calabac/.test(norm(s.primero))) v.add("verdura");
    if(/ensalada|gazpacho|salmorejo/.test(t)) v.add("cruda"); return v; }
  (day.comida&&day.comida.ids||[]).map(R).filter(Boolean).forEach(r=>(r.groups||[]).forEach(g=>{ if(g==="verdura"||g==="cruda") v.add(g); }));
  return v;
}

function generateWeek(weekId, seed, existing, opts){
  opts=opts||{};
  const rng=rngFrom(weekId+"|"+seed); const st=settings(); const T=st.targets;
  const recs=recList(); const used={};
  const use = ids => ids.forEach(id=>used[id]=(used[id]||0)+1);
  let curDate=weekId;
  /* Variedad entre semanas: penaliza lo que ya salió la semana anterior */
  const prevPlan=S.plans[addDays(weekId,-7)];
  const prevU=new Set(((prevPlan&&prevPlan.days)||[]).flatMap(d=>["comida","cena"].flatMap(k=>(d[k]&&d[k].ids)||[])));
  const seasonOk = r => !r.temporada || r.temporada.includes(parseISO(curDate).getMonth()+1);
  const by = (meal,course) => recs.filter(r=>!r.ritual && (r.meals||[]).includes(meal) && r.course===course && seasonOk(r) && (!r.adultos || curAdult));
  /* Monta una comida o cena: «ligero + plato completo» o «primero + segundo (+ guarnición)», buscando el equilibrio */
  function compose(meal, fmt, o){
    const comps=by(meal,"completo").filter(o.compFilter);
    const prims=by(meal,"primero").filter(o.primFilter);
    const ligs=by(meal,"primero").filter(r=>r.ligero===true);
    const segs=by(meal,"segundo").filter(o.segFilter);
    const guars=by(meal,"guarnicion");
    const extra = set => (o.needOk?o.needOk(set):0) + (o.avoid?-set.filter(Boolean).reduce((a,r)=>a+o.avoid(r),0):0);
    const evalC=()=>{ let best=null,bs=-Infinity;
      for(const c of comps){ const Ls=c.ligero===false&&ligs.length?ligs:[null];
        for(const l of Ls){ const sc=o.sc(c)+(l?o.sl(l):0)+balScore([l,c],meal)*1.5+extra([l,c])+rng()*1.2; if(sc>bs){bs=sc;best=[l,c];} } }
      return [best,bs]; };
    const evalP=()=>{ let best=null,bs=-Infinity; const P=prims.length?prims:[null], G=segs.length?segs:[null];
      for(const a of P) for(const b of G){ if(!a&&!b) continue;
        for(const g of [null,...(b?guars:[])]){ const set=[a,b,g];
          const sc=(a?o.sp(a):0)+(b?o.ss(b):0)+(g?o.sl(g)-0.6:0)+balScore(set,meal)*1.5+extra(set)+(o.pair?o.pair(a,b):0)+rng()*1.2;
          if(sc>bs){bs=sc;best=set;} } }
      return [best,bs]; };
    /* El formato elegido tiene ventaja, pero si sus opciones están muy gastadas gana el otro */
    const [bc,scC]=evalC(), [bp,scP]=evalP();
    const r = !bc ? bp : !bp ? bc : ((fmt==="c"?scC+2:scC) >= (fmt==="ps"?scP+2:scP) ? bc : bp);
    return (r||[]).filter(Boolean).map(x=>x.id);
  }
  const dates=weekDates(weekId);
  const days=dates.map(date=>({date, school:schoolDay(date)}));
  const ex = existing && existing.days ? Object.fromEntries(existing.days.map(d=>[d.date,d])) : {};
  const pend=new Set((opts.pending||[]).filter(R));
  const K=knowledge(weekId); const pl=opts.pantry?pantryList():[];
  let curAdult=false; /* true mientras se elige la comida de adultos de un día de cole */
  const bonus = r => (r.adultos ? (curAdult?1.5:-50) : 0) + (pend.has(r.id)?8:0) + Math.min(1.5,(K.freq[r.id]||0)*0.3) + pantryScore(r,pl);
  const pairB = (a,b) => a&&b ? Math.min(3,(K.pair[pairKey(a,b)]||0)*1.2) : 0;
  const take = ids => { use(ids); ids.forEach(id=>pend.delete(id)); };
  const frozen = (date,key) => { const e=ex[date]; if(e&&e.lock) return true; if(opts.only) return !(date===opts.only.date && key===opts.only.key); if(opts.onlyKey) return key!==opts.onlyKey; if(!opts.freezeBefore) return false; if(date<opts.freezeBefore) return true; return date===opts.freezeBefore && SLOT_ORDER[key] < (opts.freezeSlot||0); };
  const keepSlot = (date,key) => { const e=ex[date]; const s=e&&e[key]; return !!(s && (s.pin || s.fuera || frozen(date,key))); };
  const counts={carne:0,pescado:0,pazul:0,huevo:0,legumbre:0};
  const bump = (prots, groups) => { const cats=new Set(prots.map(pcat)); if((groups||[]).includes("legumbre")) cats.add("legumbre"); cats.forEach(k=>{if(k in counts)counts[k]++}); if(prots.includes("pazul")) counts.pazul++; };
  days.forEach(d=>{ if(d.school) bump(d.school.prot||[], d.school.base==="legumbre"?["legumbre"]:[]); });
  days.forEach(d=>{ ["snack","comida","merienda","cena"].forEach(k=>{ if(keepSlot(d.date,k)) use(ex[d.date][k].ids||[]); }); });
  let prevMer=[], prevSnack=[], prevDinCat=null, alt=0;
  /* Cena fija semanal (Peli y pizza): viernes si encaja con la comida del cole; si no, sábado */
  const ritual = st.pizza!=="no" ? recs.find(r=>r.ritual && (r.meals||[]).includes("cena")) : null;
  let ritualDays=[];
  if(ritual && !days.some(d=>{ const sl=ex[d.date]&&ex[d.date].cena; return sl && (sl.ids||[]).includes(ritual.id) && keepSlot(d.date,"cena"); })){
    ritualDays=days.filter(d=>(ritual.dias||[4,5]).includes(dowOf(d.date)) && !keepSlot(d.date,"cena")).map(d=>d.date);
    const fri=ritualDays[0]; const fd=days.find(d=>d.date===fri);
    if(fri && fd && fd.school && !topFor(ritual, dinnerTarget({...fd})).length) ritualDays=ritualDays.slice(1);
  }
  let ritualDone=false;
  const protMatch = (rp, P) => rp===P ? 3 : (pcat(rp)===pcat(P) ? 2 : -99);
  for(const d of days){
    const e=ex[d.date]||{};
    d.lock=!!e.lock; curDate=d.date;
    /* snack para llevar al cole (solo niñas, días de cole) */
    if(keepSlot(d.date,"snack")){ d.snack=e.snack; }
    else if(d.school){
      const all=by("merienda","merienda"); const port=all.filter(r=>r.llevar);
      const km=keepSlot(d.date,"merienda")?((e.merienda&&e.merienda.ids)||[]).map(R).filter(Boolean):[]; const kmG=new Set(km.flatMap(r=>r.groups||[]));
      const sc = r => km.length ? ["fruta","lacteo","cereal"].reduce((a,g)=>a+((r.groups||[]).includes(g)?(kmG.has(g)?-0.8:1.3):0),0) - (km.some(x=>x.id===r.id)?10:0) : 0;
      const sn=pickBest(port.length?port:all, r=>sc(r)-3*(prevSnack.includes(r.id)?1:0)-1.5*(used[r.id]||0)+bonus(r), rng);
      d.snack={ids:sn?[sn.id]:[],pin:false}; if(sn) take([sn.id]);
    } else d.snack={ids:[],pin:false};
    prevSnack=[...prevSnack.slice(-2), ...((d.snack&&d.snack.ids)||[])];
    const snR=((d.snack&&d.snack.ids)||[]).map(R).filter(Boolean); const snG=new Set(snR.flatMap(r=>r.groups||[]));
    /* comida */
    curAdult=!!d.school && !keepSlot(d.date,"comida");
    curDate=d.date;
    const gen = r => bonus(r)-3*(used[r.id]||0)-(prevU.has(r.id)?1.5:0);
    const pb=(x,y)=>pairB(x&&x.id,y&&y.id);
    if(keepSlot(d.date,"comida")){ d.comida=e.comida; }
    else if(d.school){
      const P=(d.school.prot||[])[0]||"ninguna"; const B=d.school.base;
      let fmt = st.adultFormat==="alternar" ? (alt++%2===0?"ps":"c") : (st.adultFormat==="completo"?"c":"ps");
      if(P==="legumbre") fmt="c";
      const otherBase = r => (r.groups||[]).filter(g=>["cereal","patata","legumbre"].includes(g)&&g!==B).length*1.5;
      const ids=compose("comida", fmt, {
        compFilter:r=>protMatch(r.protein,P)>0, segFilter:r=>protMatch(r.protein,P)>0,
        primFilter:r=> P==="legumbre" ? true : (B==="legumbre" || r.protein!=="legumbre"),
        sc:r=>protMatch(r.protein,P)+((r.groups||[]).includes(B)?2:0)-otherBase(r)+gen(r),
        ss:r=>protMatch(r.protein,P)+gen(r),
        sp:r=>((r.groups||[]).includes(B)?2:0)-otherBase(r)+gen(r),
        sl:r=>gen(r), pair:pb });
      d.comida={ids,pin:false,kind:"adultos"}; take(ids);
    } else {
      const opts4=["legumbre","pescado","carne","huevo"];
      const cat=pickBest(opts4, k=>((T[k]||[0,0])[0]-counts[k])*2 - (k===prevDinCat?1:0), rng);
      const wantAzul = cat==="pescado" && counts.pazul < (T.pazul||[1])[0];
      const okP = r => cat==="legumbre" ? (r.protein==="legumbre" || (r.groups||[]).includes("legumbre")) : pcat(r.protein)===cat;
      const pz = r => (wantAzul && r.protein==="pazul") ? 1.5 : 0;
      const fmt = cat==="legumbre" ? "c" : (rng()<0.55?"c":"ps");
      const ids=compose("comida", fmt, {
        compFilter:okP, segFilter:okP, primFilter:r=>r.protein!=="legumbre",
        sc:r=>pz(r)+gen(r), ss:r=>pz(r)+gen(r), sp:gen, sl:gen, pair:pb });
      d.comida={ids,pin:false,kind:"todos"}; take(ids);
      const rs=ids.map(R); bump(rs.map(r=>r.protein).filter(p=>p!=="ninguna"), rs.flatMap(r=>r.groups||[]));
    }
    curAdult=false;
    const lp=lunchProfile(d); const lv=lunchVeg(d);
    /* merienda */
    if(keepSlot(d.date,"merienda")){ d.merienda=e.merienda; }
    else {
      const comp = r => ["fruta","lacteo","cereal"].reduce((a,g)=>a+((r.groups||[]).includes(g)?(snG.has(g)?-0.8:1.3):0),0) - (snR.some(x=>x.id===r.id)?10:0);
      const merAll=by("merienda","merienda"); const merPort=merAll.filter(r=>r.llevar);
      const m=pickBest(d.school&&merPort.length?merPort:merAll, r=>comp(r)-3*(prevMer.includes(r.id)?1:0)-1.5*(used[r.id]||0)+bonus(r), rng);
      d.merienda={ids:m?[m.id]:[],pin:false}; if(m) take([m.id]);
    }
    prevMer=[...prevMer.slice(-2), ...(d.merienda.ids||[])];
    /* cena */
    let ritualHere=false;
    if(!keepSlot(d.date,"cena") && ritual && !ritualDone && ritualDays.includes(d.date)){
      const tg=dinnerTarget(d); const tops=topFor(ritual,tg);
      if(tops.length){ const top=pickBest(tops, p=>{ const k=pcat(p); const [mn]=T[k]||[0]; return (mn-counts[k]) + (tg.prefer===p?3:0) + (p==="pazul"&&counts.pazul<(T.pazul||[1])[0]?1:0); }, rng);

    }
    if(ritualHere){}

    else {
      const tg=dinnerTarget(d); const allowed=tg.allowed;
      const pendCats=new Set([...pend].map(R).filter(r=>(r.meals||[]).includes("cena")).map(r=>pcat(r.protein)));
      const cat=pickBest(allowed, k=>{ const [mn,mx]=T[k]||[0,9]; return (mn-counts[k])*2 - (counts[k]>=mx?3:0) - (k===prevDinCat?1.5:0) + (pendCats.has(k)?4:0); }, rng);
      const wantAzul = cat==="pescado" && (tg.prefer ? tg.prefer==="pazul" : counts.pazul < (T.pazul||[1])[0]);
      const ng=tg.ng;
      const pOk = r => pcat(r.protein)===cat;
      const pz = r => cat!=="pescado" ? 0 : (r.protein==="pazul" ? (wantAzul?2:-0.5) : (wantAzul?-1:0.3));
      const veg = r => { const gs=(r.groups||[]).filter(g=>g==="verdura"||g==="cruda"); return gs.reduce((a,g)=>a+(lv.has(g)?-1.2:1),0); };
      const ids=compose("cena", rng()<0.5?"c":"ps", {
        compFilter:pOk, segFilter:pOk,
        primFilter:r=>r.protein==="ninguna"||!r.protein||(ng.need.includes("legumbre")&&r.protein==="legumbre"),
        sc:r=>pz(r)+veg(r)+gen(r), ss:r=>pz(r)+gen(r), sp:r=>veg(r)+gen(r), sl:r=>veg(r)+gen(r), pair:pb,
        needOk:set=> ng.need.length ? (set.some(r=>r&&hasG(r,ng.need))?3:-4) : 0,
        avoid:r=>(r.groups||[]).filter(g=>ng.avoid.includes(g)).length*1.5 });
      d.cena={ids,pin:false}; take(ids);
    }
    const drs=(d.cena.ids||[]).map(R).filter(Boolean);
    bump(slotProts(d.cena).filter(p=>p&&p!=="ninguna"), drs.flatMap(r=>r.groups||[]));
    prevDinCat = slotProts(d.cena).map(pcat).find(c=>c&&c!=="ninguna") || null;
    /* postre de la cena */
    if(e.postre&&(e.postre.pin||frozen(d.date,"cena")||(e.cena&&e.cena.fuera))){ d.postre=e.postre; }
    else {
      const o=dinnerTarget(d).desserts; const mer=(d.merienda.ids||[]).map(R).filter(Boolean).concat(snR);
      const merLac=mer.some(r=>(r.groups||[]).includes("lacteo"));
      d.postre={v: o.includes("lacteo") && !merLac ? "lacteo" : "fruta", pin:false};
    }
  }
  return {weekId, seed, generated:true, pending:[...pend], estimated:days.filter(d=>d.school&&d.school.estimado).map(d=>d.date), days:days.map(d=>({date:d.date, lock:d.lock, snack:d.snack, comida:d.comida, merienda:d.merienda, cena:d.cena, postre:d.postre}))};
}

function dayKcal(d){
  const st=settings(); const k = ids => (ids||[]).map(R).filter(Boolean).reduce((a,r)=>a+Number(r.kcal||0),0);
  const lunch = k(d.comida&&d.comida.ids) + st.breadKcal + st.fruitKcal;

/* ----- ingredientes ----- */
const UNITS = ["g","kg","ml","l","ud","uds","unidad","unidades","env","envase","envases","cda","cdas","cdta","cdtas","diente","dientes","rebanada","rebanadas","hoja","hojas","pizca"];
function parseIng(line){
  const m=String(line).trim().match(/^(\d+(?:[.,]\d+)?)\s*([a-zA-ZáéíóúñÁÉÍÓÚÑ]+)?\.?\s+(?:de\s+)?(.+)$/);
  if(m){ let u=(m[2]||"").toLowerCase(); let name=m[3];
    if(u && !UNITS.includes(u)){ name=(m[2]+" "+m[3]); u="ud"; }
    if(!u) u="ud"; if(u==="uds"||u==="unidad"||u==="unidades") u="ud"; if(u==="envase"||u==="envases") u="env"; if(u==="kg"){return {q:parseFloat(m[1].replace(",","."))*1000,u:"g",n:name.trim()};} if(u==="l"){return {q:parseFloat(m[1].replace(",","."))*1000,u:"ml",n:name.trim()};}
    return {q:parseFloat(m[1].replace(",",".")),u,n:name.trim()}; }
  return {q:null,u:"",n:String(line).trim()};
}
const qty = (p, factor, persons) => p.u==="env" ? p.q*persons : p.q*factor;
const fmtQ = (q,u) => { if(q==null) return ""; if(u==="env"){ const r=Math.ceil(q); return `${r} envase${r===1?"":"s"}`; } if(u==="g"||u==="ml"){ return (q>=1000? (Math.round(q/100)/10).toLocaleString("es")+(u==="g"?" kg":" l") : Math.round(q/5)*5+" "+u); } const r=Math.round(q*4)/4; return `${r.toLocaleString("es")} ${u}`; };
function mealDiners(key, d){ const st=settings(); if(key==="cena") return allIds();
  /* La de 1 año (n1) recibe snack y merienda en el cole: solo se excluye los días de cole */
  const cole = d && d.school; const sinBebe = ids => cole ? ids.filter(i=>i!=="n1") : ids;
  if(key==="snack") return allIds().filter(i=>i.startsWith("n")&&i!=="n1");
  if(key==="merienda") return sinBebe(st.meriendaFor==="ninas"?allIds().filter(i=>i.startsWith("n")):allIds());
  return cole?adultIds():allIds(); }

/* ----- compra ----- */
function renderShop(){
  const w=S.week; const {plan,draft}=currentPlan();
  const pl=pantryList();
  const pantryPanel=`<div class="panel"><h2>Lo que tengo en casa</h2><p class="muted small">Uno por línea. Basta la palabra clave: «tomate» encaja con «tomate triturado». Lo que tengas sale aparte en la lista y «Con lo que tengo» prioriza recetas que lo aprovechen.</p>
    <textarea id="pantry-text" rows="5" placeholder="Garbanzos&#10;Calabacín&#10;Huevos&#10;Arroz integral">${esc(((S.pantry&&S.pantry.items)||[]).join("\n"))}</textarea>
    <div class="bar" style="margin-top:8px"><button class="btn" data-act="save-pantry">Guardar</button><button class="btn primary" data-act="save-pantry-gen">Guardar y generar la semana</button>${pl.length?`<button class="btn ghost" data-act="clear-pantry">Vaciar</button>`:""}</div></div>`;
  if(!plan) return `<div class="panel"><h2>No hay menú para esta semana</h2><p class="muted">Carga el menú del cole y genera la semana para obtener la lista.</p></div>`+pantryPanel;
  const agg={}; const days=planDays(plan); const free=[];
  for(const d of days) for(const key of ["snack","comida","merienda","cena"]){
    if(d[key]&&d[key].fuera) continue;
    const md=mealDiners(key,d); const f=fsum(md);
    (d[key]&&d[key].ids||[]).map(R).filter(Boolean).forEach(r=>(r.ingredients||[]).concat(r.toppings&&d[key].top&&r.toppings[d[key].top]?[r.toppings[d[key].top]]:[]).forEach(line=>{ const p=parseIng(line); if(p.q==null){ if(!free.includes(p.n)) free.push(p.n); return;} const k=p.n.toLowerCase()+"|"+p.u; agg[k]=agg[k]||{n:p.n,u:p.u,q:0}; agg[k].q+=qty(p,f,md.length); }));
  }
  const nb=days.reduce((a,d)=>a+(d.postre&&d.postre.v==="lacteo"&&!(d.cena&&d.cena.fuera)?1:0),0);
  const all=Object.values(agg).sort((a,b)=>a.n.localeCompare(b.n,"es")).concat(free.sort((a,b)=>a.localeCompare(b,"es")).map(n=>({n,u:"",q:null})));
  const buy=all.filter(it=>!inPantry(it.n,pl)), have=all.filter(it=>inPantry(it.n,pl));
  const ticks=loadTicks(w);
  const row=(it,i,pre)=>{const id=pre+i; const key=it.n+"|"+it.u; return `<label for="${id}"><input type="checkbox" id="${id}" data-act-change="tick" data-k="${esc(key)}" ${ticks[key]?"checked":""}><span>${esc(it.n)}</span><span class="q">${it.q==null?"al gusto":fmtQ(it.q,it.u)}</span></label>`;};
  let out=`<div class="sec-h"><div><h2>Lista de compra · semana del ${fmtShort(w)}</h2><div class="muted small">${draft?"Basada en la propuesta sin guardar. ":""}Cantidades para todos los comensales de cada toma (incluye comida de adultos en días de cole; no cuenta lo que coméis fuera). No incluye desayunos.</div></div><div class="bar"><button class="btn ghost" data-act="untick-all">Desmarcar todo</button><button class="btn" data-act="copy-shop">Copiar lista</button></div></div>`;
  out+=`<div class="panel"><h2>Comprar</h2><div class="shop">${buy.map((it,i)=>row(it,i,"sb-")).join("")||`<p class="muted">Nada: lo tienes todo.</p>`}</div>
  <p class="muted small" style="margin-top:12px">Además: pan para comida y cena, fruta de temporada para postres y ${nb} día${nb===1?"":"s"} de yogur natural en la cena.</p></div>`;
  if(have.length) out+=`<div class="panel"><h2>Ya lo tienes en casa</h2><p class="muted small">Comprueba que llega la cantidad.</p><div class="shop">${have.map((it,i)=>row(it,i,"sh-")).join("")}</div></div>`;
  out+=pantryPanel;
  S._shopText = buy.map(it=>`- ${it.n}${it.q==null?"":": "+fmtQ(it.q,it.u)}`).join("\n");
  return out;
}

/* ---------- persistencia ---------- */
async function put(path, data){
  if(!S.db){ return false; }
  try{ await S.db.doc(path).set(data); return true; }
  catch(e){ if(e&&e.code==="unavailable"){ await new Promise(r=>setTimeout(r,600+Math.random()*600)); try{ await S.db.doc(path).set(data); return true; }catch(e2){} }
    toast(e&&e.code==="quota_exceeded"?"Almacenamiento lleno: borra recetas o semanas antiguas.":"No se pudo guardar. Inténtalo de nuevo."); return false; }
}
async function del(path){ if(!S.db) return false; try{ await S.db.doc(path).delete(); return true; }catch(e){ toast("No se pudo borrar."); return false; } }
async function savePlan(plan){
  plan.updated=Date.now(); plan.generated=undefined; delete plan.generated;
  S.plans[plan.weekId]=plan; render();
  if(await put("plans/"+plan.weekId, JSON.parse(JSON.stringify(plan)))) toast("Menú guardado");
}

}

      groups:(r.groups||[]).filter(g=>okG.includes(g)), kcal:Math.round(Number(r.kcal)||0), ingredients:(r.ingredients||[]).map(String).slice(0,15),
      steps:String(r.steps||""), kids:String(r.kids||""), harvard:!!r.harvard, llevar:r.course==="merienda"&&!!r.llevar }));
  }catch(e){ const c=e&&e.code; toast(c==="not_granted"?"Has denegado el permiso para usar Claude en esta página.":c==="rate_limited"?"Demasiadas peticiones; espera un momento.":"No se pudieron generar recetas. Inténtalo de nuevo."); }
  S.aiBusy=false; aiModal();
}
async function aiAdd(){
  const sel=(S.aiProps||[]).filter((r,i)=>{ const c=$("#aip-"+i); return c&&c.checked; });
  let n=0;
  for(const r of sel){ const id="ai"+Date.now().toString(36)+Math.random().toString(36).slice(2,5); const rec={...r,id,link:"",updated:Date.now(),source:"claude"}; S.recipes[id]=rec; if(await put("recipes/"+id, rec)) n++; }
  S.aiProps=null; closeModal(); render(); toast(`${n} receta${n===1?"":"s"} añadida${n===1?"":"s"}. Revisa cantidades y kcal.`);
}

/* ---------- aprendizaje y copia de seguridad ---------- */
function findByName(name){ const n=norm(name); if(!n) return null; const L=recList(); return L.find(r=>norm(r.name)===n) || L.find(r=>{ const rn=norm(r.name); return rn.includes(n)||n.includes(rn); }) || null; }
function mapTheirRecipe(r){
  const g=r.grupo; const prot={legumbre:"legumbre",pescado:"pblanco",carne:"carne",huevo:"huevo"}[g]||"ninguna";
  const groups=[]; if(g==="feculento") groups.push("cereal"); if(g==="legumbre") groups.push("legumbre"); if(r.vtipo==="cruda") groups.push("cruda"); if(r.vtipo==="cocida"||(g==="verdura"&&r.vtipo!=="cruda")) groups.push("verdura");
  const meals=[]; if(r.comida!==false) meals.push("comida"); if(r.cena) meals.push("cena");
  return {name:String(r.name), course:["primero","segundo","completo"].includes(r.plato)?r.plato:"completo", protein:prot, groups, meals:meals.length?meals:["comida"], kcal:0,
    ingredients:(r.ingredients||[]).map(String), steps:"", kids:String(r.baby||""), link:/^https?:\/\//i.test(r.link||"")?r.link:"", harvard:false};
}
async function importBackup(obj){
  let msg=[];
  if(obj && obj.app==="menu-familiar"){
    let n=0;
    for(const [col,docs] of [["recipes",obj.recipes],["school",obj.school],["plans",obj.plans]]) for(const [id,doc] of Object.entries(docs||{})){ if(await put(col+"/"+id, doc)) n++; }
    if(obj.settings) await put("settings/main", obj.settings); if(obj.pantry) await put("settings/pantry", obj.pantry); if(obj.knowledge) await put("settings/knowledge", obj.knowledge);
    return `Copia restaurada: ${n} documentos.`;
  }
  const idMap={};
  if(Array.isArray(obj&&obj.library)){
    let added=0;
    for(const r of obj.library){ if(!r||!r.name) continue; const ex=findByName(r.name); if(ex){ idMap[r.id]=ex.id; continue; }
      const id="imp"+Date.now().toString(36)+Math.random().toString(36).slice(2,5); const rec={...mapTheirRecipe(r),id,updated:Date.now(),source:"importada"}; S.recipes[id]=rec; idMap[r.id]=id; if(await put("recipes/"+id, rec)) added++; }
    msg.push(`${added} recetas nuevas (revisa proteína, grupos, cantidades y kcal)`);
  }
  if(Array.isArray(obj&&obj.pantry) && obj.pantry.length){ const items=[...new Set([...((S.pantry&&S.pantry.items)||[]), ...obj.pantry.map(String)])]; S.pantry={items,updated:Date.now()}; await put("settings/pantry", S.pantry); msg.push("despensa actualizada"); }
  const K={freq:{...((S.knowledge||{}).freq||{})}, pair:{...((S.knowledge||{}).pair||{})}, meals:(S.knowledge||{}).meals||0}; let learned=0, unknown=0;
  const learn = ids => { ids=ids.filter(Boolean); if(!ids.length) return; learned++; ids.forEach(id=>K.freq[id]=(K.freq[id]||0)+1); for(let i=0;i<ids.length;i++) for(let j=i+1;j<ids.length;j++){ const p=pairKey(ids[i],ids[j]); K.pair[p]=(K.pair[p]||0)+1; } };
  const resolve = x => { if(typeof x==="string"){ const r=findByName(x); if(!r) unknown++; return r&&r.id; } return idMap[x]||null; };
  if(obj&&obj.knowledge&&obj.knowledge.freq){ Object.entries(obj.knowledge.freq).forEach(([id,n])=>{ const m=idMap[id]; if(m) K.freq[m]=(K.freq[m]||0)+n; }); Object.entries(obj.knowledge.pair||{}).forEach(([k,n])=>{ const [a,b]=k.split("|"); if(idMap[a]&&idMap[b]){ const p=pairKey(idMap[a],idMap[b]); K.pair[p]=(K.pair[p]||0)+n; } }); K.meals+=obj.knowledge.meals||0; }
  if(obj&&obj.plan&&typeof obj.plan==="object"&&!Array.isArray(obj.plan)) Object.values(obj.plan).forEach(sl=>{ if(sl&&sl.status!=="fuera") learn((sl.items||[]).map(x=>idMap[x]||null)); });
  const menus = Array.isArray(obj&&obj.menus) ? obj.menus : (Array.isArray(obj)?obj:[]);
  menus.forEach(d=>{ if(!d) return; ["comida","cena"].forEach(k=>{ if(Array.isArray(d[k])) learn(d[k].map(resolve)); }); if(Array.isArray(d.platos)) learn(d.platos.map(resolve)); });
  if(learned || (obj&&obj.knowledge)){ S.knowledge={...K,updated:Date.now()}; await put("settings/knowledge", S.knowledge); msg.push(`aprendido de ${learned} comidas${unknown?` (${unknown} platos no reconocidos)`:""}`); }
  return msg.length ? msg.join(" · ").replace(/^./,c=>c.toUpperCase())+"." : "No he reconocido nada que importar en ese archivo.";
}
async function exportBackup(){
  const data={app:"menu-familiar", v:1, exported:new Date().toISOString(), recipes:S.recipes, school:S.school, plans:S.plans, settings:S.settings, pantry:S.pantry, knowledge:S.knowledge};
  if(!S.downloads){ toast("La descarga no está disponible en esta vista."); return; }
  try{ const r=await S.downloads.save({filename:`menu-familiar-${iso(new Date())}.json`, data:JSON.stringify(data,null,1)}); if(r&&r.status==="saved") toast("Copia guardada"); }
  catch(e){ if(!(e&&e.code==="cancelled")) toast("No se pudo guardar la copia."); }
}

/* ---------- importación con Claude ---------- */
async function doImport(){
  const text=($("#imp-text").value||"").trim(); const when=($("#imp-when").value||"").trim();
  const imgIn=$("#imp-img"); const img=imgIn&&imgIn.files&&imgIn.files[0];
  if(!text && !img){ toast("Pega el texto del menú o sube una captura."); return; }
  S.importing=true; render();
  const prompt=`Eres un asistente que estructura menús de comedor escolar en España. Menú de: ${when}.
Devuelve SOLO JSON con esta forma:
{"days":[{"date":"YYYY-MM-DD","primero":"","segundo":"","guarnicion":"","postre":"","prot":["..."],"base":"","postreTipo":"","sug":""}]}
Reglas:
- Un elemento por día lectivo con menú. Fecha ISO con el año correcto.
- prot: proteínas animales o legumbre del día, de entre "carne","pblanco" (merluza, abadejo, limanda, bacalao, gallo, rosada…),"pazul" (salmón, sardina, caballa, atún, bonito, boquerón),"huevo" (tortilla, revuelto),"legumbre". La PRIMERA debe ser la proteína del segundo plato. Añade la del primero si la tiene (p. ej. paella de carne → "carne"; lentejas → "legumbre").
- base: grupo principal del primer plato: "cereal" (arroz, pasta, fideos, cuscús), "patata", "legumbre" o "verdura" (cremas, purés, verduras).
- postreTipo: "fruta", "lacteo" (yogur, natillas, helado…) o "ambos" (fruta y yogur).
- sug: solo si el texto incluye la cena recomendada por el cole para ese día, con el formato «Base · proteína · postre», p. ej. «Verduras cocinadas · pescado blanco · pan, fruta»; si no, "".
- No inventes platos. Quita los códigos de alérgenos tipo C:(1,3) o PC:(...).
${text?`Texto del menú:\n${text}`:"El menú está en la imagen adjunta."}`;
  try{
    const opts={modelTier:"default"}; if(img) opts.images=[img];
    const res=await S.sample.json(prompt, opts);
    const days=(res&&res.days)||[]; const valid=["carne","pblanco","pazul","huevo","legumbre"];
    const byWeek={};
    days.forEach(d=>{ if(!/^\d{4}-\d{2}-\d{2}$/.test(d.date||"")) return; const w=mondayOf(d.date);
      byWeek[w]=byWeek[w]||{...(S.school[w]||{weekId:w,days:{}}), days:{...((S.school[w]||{}).days||{})}};
      byWeek[w].days[d.date]={primero:String(d.primero||""),segundo:String(d.segundo||""),guarnicion:String(d.guarnicion||""),postre:String(d.postre||""),
        sug:String(d.sug||""), prot:(d.prot||[]).filter(p=>valid.includes(p)), base:BASES[d.base]?d.base:"verdura", postreTipo:["fruta","lacteo","ambos"].includes(d.postreTipo)?d.postreTipo:"fruta"}; });
    const ws=Object.keys(byWeek).sort();
    if(!ws.length){ toast("No he encontrado días con fecha en el texto. Revisa el mes y el contenido."); }
    else {
      for(const w of ws){ byWeek[w].weekId=w; byWeek[w].updated=Date.now(); S.school[w]=byWeek[w]; await put("school/"+w, byWeek[w]); }
      S._impText=""; S.week=ws[0]; toast(`Importados ${days.length} días en ${ws.length} semana${ws.length>1?"s":""}. Revisa la clasificación.`);
    }
  }catch(e){
    const c=e&&e.code; toast(c==="not_granted"?"Has denegado el permiso para usar Claude en esta página.":c==="rate_limited"?"Demasiadas peticiones; espera un momento.":"No se pudo interpretar el menú. Prueba con menos texto o escríbelo a mano.");
  }
  S.importing=false; render();
}

/* ---------- arranque ---------- */
S.week = mondayOf(iso(new Date()));
render();
function maybeAutoWeek(){
  if(!S.weekAuto || !S.loaded.school) return;
  S.weekAuto=false;
  const cur=mondayOf(iso(new Date()));
  if(!S.school[cur]){
    const ws=Object.keys(S.school).sort().filter(w=>w<=cur);
    if(!ws.length || settings().noSchool!=="pauta"){ if(ws.length){ S.week=ws[ws.length-1]; S.weekNotice=`No hay menú del cole para la semana del ${fmtShort(cur)}. Te muestro la última semana cargada.`; } }
  }
}
(async () => {
  const c=window.claude;
  const db = c && c.use ? await c.use("db").catch(()=>null) : null;
  if(!db){ S.dbState="none"; Object.keys(S.loaded).forEach(k=>S.loaded[k]=true); render(); }
  else {
    S.db=db; S.dbState="ok";
    const err = () => { };
    db.collection("recipes").onSnapshot(snap=>{ const o={}; snap.docs.forEach(d=>{ o[d.id]={...d.data(), id:d.id}; }); S.recipes=o; S.loaded.recipes=true; if(!$("#modal-root").innerHTML && !document.activeElement.matches("input,textarea,select")) render(); }, err);
    db.collection("school").onSnapshot(snap=>{ const o={}; snap.docs.forEach(d=>{ o[d.id]=d.data(); }); S.school=o; S.loaded.school=true; maybeAutoWeek(); if(!(S.tab==="cole" && document.activeElement.matches("input,textarea,select"))) render(); }, err);
    db.collection("plans").onSnapshot(snap=>{ const o={}; snap.docs.forEach(d=>{ o[d.id]=d.data(); }); S.plans=o; S.loaded.plans=true; if(!S.editing) render(); }, err);
    db.doc("settings/pantry").onSnapshot(snap=>{ S.pantry=snap.exists?snap.data():null; if(!(S.tab==="compra" && document.activeElement && document.activeElement.id==="pantry-text")) render(); }, err);
    db.doc("settings/knowledge").onSnapshot(snap=>{ S.knowledge=snap.exists?snap.data():null; if(S.tab==="ajustes") render(); }, err);
    db.doc("settings/main").onSnapshot(snap=>{ S.settings=snap.exists?snap.data():null; S.loaded.settings=true; if(S.tab!=="ajustes") render(); }, err);
  }
  const dl = c && c.use ? await c.use("downloads").catch(()=>null) : null; if(dl){ S.downloads=dl; if(S.tab==="ajustes") render(); }
  const sample = c && c.use ? await c.use("sample").catch(()=>null) : null;
  if(sample){ S.sample=sample; try{ const l=await sample.limits(); S.sampleImages=!!(l&&l.images); }catch(e){} if(S.tab==="cole") render(); }
})();
})();
